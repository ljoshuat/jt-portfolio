<section class="jtl" id="jt-logo-sheet" aria-labelledby="jtl-title">
<style>
.jtl{
  --jtl-bg:var(--color--bg-primary,#0A0F12);
  --jtl-fg:var(--color--text-primary,#F7F7F7);
  --jtl-accent:var(--color--accent,#DAF40A);
  --jtl-ink:#0A0F12;
  --jtl-lime:#DAF40A;
  --jtl-line:color-mix(in srgb,var(--jtl-fg) 18%,transparent);
  --jtl-mono:"Ppneuemontrealmono","PP Neue Montreal Mono","JetBrains Mono",ui-monospace,monospace;
  --jtl-ease:cubic-bezier(.2,.7,.2,1);
  background:var(--jtl-bg);color:var(--jtl-fg);
  padding-block:clamp(4rem,9vw,8rem);
  overflow:hidden;
}
.jtl *{box-sizing:border-box}
.jtl-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.jtl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
@media (min-width:768px){.jtl-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.jtl-tile{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;aspect-ratio:291/328}
.jtl-wide{grid-column:span 2;aspect-ratio:582/328}
.jtl-hero{background:var(--jtl-lime);border-top-left-radius:clamp(1.5rem,3.5vw,3rem)}
.jtl-hero svg{width:32%;height:auto;fill:var(--jtl-ink);overflow:visible}
.jtl-outline svg{width:48%;height:auto;overflow:visible}
.jtl-outline .jtl-box,.jtl-outline .jtl-gl{fill:none;stroke:var(--jtl-line);stroke-width:1;vector-effect:non-scaling-stroke}
.jtl-outline .jtl-box{stroke:color-mix(in srgb,var(--jtl-fg) 45%,transparent)}
.jtl-outline .jtl-mk{fill:none;stroke:var(--jtl-fg);stroke-width:1.25;vector-effect:non-scaling-stroke}
.jtl-app{width:23%;aspect-ratio:1;border-radius:22%;background:var(--jtl-lime);display:flex;align-items:center;justify-content:center;position:relative;transition:transform .5s var(--jtl-ease)}
.jtl-app svg{width:62%;height:auto;fill:var(--jtl-ink)}
.jtl-ping{position:absolute;top:-12%;right:-12%;width:26%;aspect-ratio:1;border-radius:50%;background:#fff;color:var(--jtl-ink);font:500 clamp(.7rem,1vw,.9rem)/1 var(--jtl-mono);display:flex;align-items:center;justify-content:center;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.jtl-icon:hover .jtl-app{transform:translateY(-4%)}
.jtl-icon:hover .jtl-ping{transform:scale(1.15)}
.jtl-spec{margin:0;font-family:var(--jtl-mono);font-size:clamp(.625rem,.75vw,.75rem);letter-spacing:.04em;text-transform:uppercase;line-height:1.5;position:absolute;top:12%;left:10%}
.jtl-ink{background:var(--jtl-ink);color:#F7F7F7}
.jtl-ink svg{position:absolute;left:10%;bottom:10%;width:30%;height:auto;fill:var(--jtl-lime);overflow:visible}
.jtl-ink .jtl-tick{transition:transform .5s var(--jtl-ease)}
.jtl-ink:hover .jtl-tick{transform:translate(4%,-6%)}
.jtl-lime{background:var(--jtl-lime);color:var(--jtl-ink);border-bottom-right-radius:clamp(1.5rem,3.5vw,3rem)}
.jtl-buildwrap{margin-top:clamp(3rem,7vw,6rem)}
.jtl-build{display:block;width:100%;height:auto;overflow:visible}
@media (max-width:767px){.jtl-buildwrap{overflow:hidden}.jtl-build{width:170%;margin-left:-35%}}
.jtl-guides line,.jtl-circles circle{fill:none;stroke:var(--jtl-line);stroke-width:1;vector-effect:non-scaling-stroke}
.jtl-dot{fill:color-mix(in srgb,var(--jtl-fg) 60%,transparent)}
.jtl-shape path{fill:color-mix(in srgb,var(--jtl-accent) 16%,transparent);stroke:var(--jtl-accent);stroke-width:1.25;vector-effect:non-scaling-stroke}
.jtl-pts rect{fill:var(--jtl-bg);stroke:var(--jtl-accent);stroke-width:1;vector-effect:non-scaling-stroke}
@media (prefers-reduced-motion:reduce){
  .jtl-app,.jtl-ping,.jtl-ink .jtl-tick{transition:none}
  .jtl-icon:hover .jtl-app,.jtl-icon:hover .jtl-ping,.jtl-ink:hover .jtl-tick{transform:none}
}
</style>
