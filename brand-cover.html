<section class="jtc" id="jt-brand-cover" aria-labelledby="jtc-title">
<style>
.jtc{
  --jtc-bg:var(--color--bg-primary,#0A0F12);
  --jtc-fg:var(--color--text-primary,#F7F7F7);
  --jtc-accent:var(--color--accent,#DAF40A);
  --jtc-display:var(--typography--font-display,"Druk Wide Web"),"Druk Wide",Verdana,sans-serif;
  --jtc-serif:"Ppeditorialnew","PP Editorial New",Georgia,serif;
  --jtc-ease:cubic-bezier(.2,.7,.2,1);
  background:var(--jtc-bg);color:var(--jtc-fg);
  padding-block:clamp(4rem,9vw,8rem);
  overflow:hidden;
}
.jtc *{box-sizing:border-box}
.jtc-grid{display:grid;grid-template-columns:1fr;gap:3rem;align-items:center}
@media (min-width:768px){.jtc-grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(2rem,4vw,5rem)}}
.jtc-copy{container-type:inline-size;min-width:0}
.jtc-title{margin:0;font-family:var(--jtc-display);font-weight:700;text-transform:uppercase;font-size:clamp(1.5rem,6vw,7.75rem);font-size:clamp(1.5rem,10.8cqi,7.75rem);line-height:.95;letter-spacing:-.01em}
.jtc-title span{display:block}
.jtc-sub{margin:clamp(1rem,1.6vw,1.75rem) 0 0;font-family:var(--jtc-serif);font-style:italic;font-weight:200;font-size:clamp(1.5rem,3.35vw,4rem);line-height:1.05;color:var(--jtc-accent)}
.jtc-mark{display:flex;justify-content:flex-end}
.jtc-mark svg{width:min(100%,42rem);height:auto;fill:var(--jtc-accent);overflow:visible}
@media (max-width:767px){.jtc-mark{order:-1;justify-content:flex-start}.jtc-mark svg{width:min(60%,16rem)}}
@keyframes jtc-rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes jtc-lean{from{opacity:0;transform:translate(8%,-6%)}to{opacity:1;transform:none}}
.jtc-title span,.jtc-sub{animation:jtc-rise .9s var(--jtc-ease) both}
.jtc-title span:nth-child(2){animation-delay:.1s}
.jtc-sub{animation-delay:.25s}
.jtc-mark svg{animation:jtc-lean 1.1s var(--jtc-ease) .15s both}
@media (prefers-reduced-motion:reduce){
  .jtc-title span,.jtc-sub,.jtc-mark svg{animation:none}
}
</style>
<div class="jtc-inner">
  <div class="jtc-grid">
    <div class="jtc-copy">
      <h2 class="jtc-title" id="jtc-title"><span>Brand</span> <span>Guidelines</span></h2>
      <p class="jtc-sub">Josh Turner, designer and developer</p>
    </div>
    <div class="jtc-mark">
      <svg viewBox="113.8 76 352.4 280" role="img" aria-label="The JT mark">
        <path transform="translate(113.795 89)" d="M87.951 0H236.33L196.392 160.829C179.777 222.007 123.847 267 57.408 267H0L22.101 178H56.748C82.455 178 104.149 160.814 110.495 137.446L118.811 103.961C128.657 94.685 141.925 89 156.521 89H65.85Z"/>
        <g transform="translate(362.024 89)"><path class="jtc-tick" d="M22.101 0H98.101L76 89H0Z"/></g>
      </svg>
    </div>
  </div>
</div>
</section>
