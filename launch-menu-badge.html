<!-- RECENTLY LAUNCHED badge for the site menu (HtmlEmbed inside .menu-wrap in nav-component).
     Sits under the menu links (after .menu-nav in .menu-panel) and pops in after the last item.
     launch-modal.js wires it up; hidden on pages without the Recently Launched component. -->
<style>
.launch-menu-bug {
  display: block;
  width: 6rem;
  height: 6rem;
  margin-top: clamp(1.5rem, 3vw, 2.5rem);
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: none;
  cursor: pointer;
  opacity: 0;
  transform: translateY(40px) rotate(-8deg);
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.menu-wrap.is-open .launch-menu-bug {
  opacity: 1;
  transform: rotate(-8deg);
  /* lands just after the last menu item (items start at 0.8s, 0.12s apart) */
  transition: opacity 0.7s ease 1.3s,
    transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 1.3s;
}
.launch-menu-bug svg {
  display: block;
  width: 100%;
  height: 100%;
  transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.launch-menu-bug svg circle { fill: var(--color--accent, #e3ff00); }
.launch-menu-bug svg path { fill: var(--color--bg-primary, #000); }
.launch-menu-bug:hover svg,
.launch-menu-bug:focus-visible svg { transform: rotate(8deg) scale(1.06); }
.launch-menu-bug:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
body:not(:has([data-launch-modal])) .launch-menu-bug { display: none; }
@media (max-width: 767px) {
  .launch-menu-bug { width: 5rem; height: 5rem; }
}
@media (prefers-reduced-motion: reduce) {
  .launch-menu-bug, .menu-wrap.is-open .launch-menu-bug { transition: opacity 0.2s ease; }
}
</style>
