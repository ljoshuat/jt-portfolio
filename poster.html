<style>
.jtp{
  --jtp-ink:#0A0F12;--jtp-lime:#DAF40A;--jtp-paper:#F7F7F7;
  --jtp-sans:"Ppneuemontreal","PP Neue Montreal","Neue Montreal",system-ui,sans-serif;
  --jtp-serif:"Ppeditorialnew","PP Editorial New",Georgia,serif;
  --jtp-mono:"Ppneuemontrealmono","PP Neue Montreal Mono",ui-monospace,monospace;
  container-type:inline-size;width:100%;overflow:hidden;background:var(--jtp-ink);
}
.jtp *{box-sizing:border-box}
.jtp-defs{position:absolute;width:0;height:0;overflow:hidden}
.jtp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.jtp-cell{position:relative;aspect-ratio:4/5;overflow:hidden;container-type:inline-size}
.jtp-cell>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.jtp-wide{grid-column:span 2;aspect-ratio:8/5}
.jtp-ink{background:var(--jtp-ink);color:var(--jtp-paper)}
.jtp-lime{background:var(--jtp-lime);color:var(--jtp-ink)}
.jtp-paper{background:var(--jtp-paper);color:var(--jtp-ink)}
.jtp .jtp-txt{position:absolute;margin:0;color:inherit;font-family:var(--jtp-sans);font-feature-settings:"ss01" 0}
/* every size below is the Figma px value over the cell's 480px width (960 for the headline) */
.jtp .jtp-cap{left:10%;top:83.333%;font-size:max(11px,calc(26/480*100cqi));line-height:1.25;font-weight:300}
.jtp .jtp-head{left:7.5%;top:25%;font-size:calc(76/960*100cqi);line-height:1.05;letter-spacing:-.02em;font-weight:400}
.jtp .jtp-seal{left:10%;top:86.667%;font-family:var(--jtp-mono);font-size:max(10px,calc(14/480*100cqi));letter-spacing:.08em;text-transform:uppercase;color:var(--jtp-lime);line-height:1.3}
.jtp .jtp-svc{left:13.333%;top:20%;font-family:var(--jtp-serif);font-style:italic;font-size:calc(56/480*100cqi);line-height:1.05;letter-spacing:0;font-weight:200}
.jtp-sun line{stroke:var(--jtp-lime);stroke-width:2}
.jtp-fence use{stroke:var(--jtp-lime);stroke-width:6.667}
.jtp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@container (max-width:599px){
  .jtp-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row dense}
  .jtp-fence{display:none}
}
</style>
