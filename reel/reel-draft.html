<title>Work Reel Draft</title>
<style>
@font-face{font-family:"Druk Wide Web";src:url("https://cdn.prod.website-files.com/6ac66533162bac8c8f01fb1b/6ac66533162bac8c8f01fc1c_Druk%20Wide-Bold-Web.woff2") format("woff2");font-weight:700}
@font-face{font-family:"Neue Montreal";src:url("https://cdn.prod.website-files.com/6ac66533162bac8c8f01fb1b/6ac66533162bac8c8f01fc21_PPNeueMontreal-Regular.woff2") format("woff2");font-weight:400}
:root{
  /* Site tokens: ink canvas, lime accent, paper */
  --ink:#0A0F12; --lime:#DAF40A; --paper:#F7F7F7; --gray:#7D7D7D;
  --display:"Druk Wide Web",Verdana,sans-serif; --text:"Neue Montreal",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050708;color:var(--paper);font-family:var(--text)}
.wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 16px}
.viewport{width:min(100%,1280px);aspect-ratio:16/9;position:relative;overflow:hidden;background:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--ink)}
.layer{position:absolute;inset:0;visibility:hidden}
.layer.on{visibility:visible}
.layer video,.layer img{position:absolute;display:block}
.full video{inset:0;width:100%;height:100%;object-fit:cover}
.inset video{left:50%;top:50%;width:78%;height:78%;transform:translate(-50%,-50%);object-fit:cover;border-radius:22px}
.logo img{inset:0;width:100%;height:100%;object-fit:contain}
.word{display:flex;align-items:center;justify-content:center}
.word span{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:150px;line-height:.9;letter-spacing:-.01em;text-align:center}
.url{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-family:var(--text);font-size:44px;letter-spacing:.01em}
#bars{position:absolute;inset:0;pointer-events:none;z-index:5}
#bars i{position:absolute;top:0;bottom:0;width:20%;transform:translateY(-101%)}
.controls{width:min(100%,1280px);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:14px;color:#cfd3d6}
.controls button{font:inherit;background:var(--lime);color:var(--ink);border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
.controls button.ghost{background:#1b2226;color:var(--paper)}
.controls input[type=range]{flex:1 1 300px}
.controls input[type=number]{width:64px;font:inherit;background:#1b2226;color:var(--paper);border:1px solid #2c353a;border-radius:6px;padding:4px 6px}
#log{width:min(100%,1280px);font-size:13px;color:#9aa1a5;line-height:1.5}
#shotname{font-variant-numeric:tabular-nums;min-width:240px}
</style>
</head>
<body>
<div class="wrap">
  <div class="viewport" id="vp"><div id="stage"><div id="bars"></div></div></div>
  <div class="controls">
    <button id="play">Play</button>
    <button class="ghost" id="click">Beat click: off</button>
    <label>BPM <input type="number" id="bpm" value="110" min="70" max="160"></label>
    <label class="ghost">Music <input type="file" id="music" accept="audio/*"></label>
    <input type="range" id="scrub" min="0" max="1000" value="0">
    <span id="shotname"></span>
  </div>
  <div id="log">Draft 1. Hard cuts on the beat, colour-bar wipes between chapters, loops after the end card. Clips stream from Bunny at 720p, so the first loop can stutter while they buffer; the second loop is the real feel.</div>
</div>

const WIPE=['#DAF40A','#0A0F12','#F7F7F7','#DAF40A','#0A0F12'];

const stage=document.getElementById('stage'), vp=document.getElementById('vp'), bars=document.getElementById('bars');
function fit(){stage.style.transform=`scale(${vp.clientWidth/1920})`}
addEventListener('resize',fit); fit();
WIPE.forEach((c,i)=>{const e=document.createElement('i');e.style.left=(i*20)+'%';e.style.background=c;bars.appendChild(e)});

// build layers
let t0=0; EDL.forEach(s=>{s.start=t0; t0+=s.b;});
const TOTAL=t0; // beats
EDL.forEach(s=>{
  const L=document.createElement('div'); L.className='layer';
  if(s.v){L.classList.add(s.frame); if(s.bg) L.style.background=s.bg; const vd=document.createElement('video'); vd.muted=true; vd.playsInline=true; vd.preload='auto'; vd.crossOrigin='anonymous'; vd.src=HOST+V[s.v]+'/play_720p.mp4'; L.appendChild(vd); s.el=vd;}
  else if(s.img){L.classList.add('logo'); L.style.background=s.bg; const im=document.createElement('img'); im.src=s.img; im.alt=s.n; L.appendChild(im);}
  else if(s.word){L.classList.add('word'); L.style.background=s.bg; L.innerHTML=`<span style="color:${s.fg}">${s.word}</span>`;}
  stage.insertBefore(L,bars); s.layer=L;
});

let bpm=110, playing=false, startAt=0, pos=0, cur=-1, clickOn=false, actx=null, lastBeat=-1;
const beatLen=()=>60/bpm;
const audio=new Audio();
function shotAt(b){for(let i=EDL.length-1;i>=0;i--) if(b>=EDL[i].start) return i; return 0}
function show(i,beatPos){
  const s=EDL[i];
  if(i!==cur){ if(cur>=0){EDL[cur].layer.classList.remove('on'); if(EDL[cur].el) EDL[cur].el.pause();}
    s.layer.classList.add('on'); cur=i; document.getElementById('shotname').textContent=s.n;
    s.layer.animate([{transform:'scale(1.045)'},{transform:'scale(1)'}],{duration:beatLen()*1000*.9,easing:'cubic-bezier(.2,.8,.2,1)'});
    if(s.wipeIn) wipe();
  }
  if(s.el){const want=s.at+(beatPos-s.start)*beatLen(); if(Math.abs(s.el.currentTime-want)>0.25) s.el.currentTime=want; if(playing&&s.el.paused) s.el.play().catch(()=>{}); if(!playing) s.el.pause();}
}
function wipe(){[...bars.children].forEach((e,k)=>{e.animate([{transform:'translateY(-101%)'},{transform:'translateY(0)',offset:.45},{transform:'translateY(0)',offset:.55},{transform:'translateY(101%)'}],{duration:beatLen()*1000*1.1,delay:k*28,easing:'cubic-bezier(.7,0,.3,1)',fill:'none'})})}
function tick(b){ if(!clickOn||!actx) return; const bi=Math.floor(b); if(bi!==lastBeat){lastBeat=bi; const o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=bi%4===0?1400:900; g.gain.setValueAtTime(.25,actx.currentTime); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.05); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+.06);} }
function frame(){
  if(playing){ pos=((performance.now()-startAt)/1000)/beatLen(); if(pos>=TOTAL){ pos=pos%TOTAL; startAt=performance.now()-pos*beatLen()*1000; if(audio.src){audio.currentTime=0;} } }
  show(shotAt(pos),pos); tick(pos); document.getElementById('scrub').value=Math.round(pos/TOTAL*1000);
  requestAnimationFrame(frame);
}
document.getElementById('play').onclick=e=>{
  playing=!playing; e.target.textContent=playing?'Pause':'Play';
  if(playing){startAt=performance.now()-pos*beatLen()*1000; if(audio.src){audio.currentTime=pos*beatLen(); audio.play();}}
  else{audio.pause(); if(cur>=0&&EDL[cur].el) EDL[cur].el.pause();}
};
document.getElementById('click').onclick=e=>{clickOn=!clickOn; if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); e.target.textContent='Beat click: '+(clickOn?'on':'off')};
document.getElementById('bpm').onchange=e=>{const p=pos; bpm=+e.target.value||110; startAt=performance.now()-p*beatLen()*1000};
document.getElementById('music').onchange=e=>{const f=e.target.files[0]; if(f){audio.src=URL.createObjectURL(f);}};
document.getElementById('scrub').oninput=e=>{pos=e.target.value/1000*TOTAL; startAt=performance.now()-pos*beatLen()*1000; if(audio.src) audio.currentTime=pos*beatLen();};
document.getElementById('log').textContent+=` ${EDL.length} shots, ${TOTAL} beats = ${(TOTAL*60/110).toFixed(1)}s at 110 BPM.`;
requestAnimationFrame(frame);
</script>
