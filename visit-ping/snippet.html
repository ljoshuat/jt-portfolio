<!-- Visit ping: Slack message for each new visitor, with the pages they view, panels they open and theme switches as thread replies, and time on site.
     No cookies, no Google Analytics.
     Skip your own visits: open https://www.jtcreative.design/?noping once on each of your browsers.
     Turn it back on with ?ping -->
<script>
(function () {
  var ENDPOINT = 'https://visit-ping.visit-ping.workers.dev/';
  try {
    var q = location.search;
    if (/[?&]noping\b/.test(q)) localStorage.setItem('jt-noping', '1');
    if (/[?&]ping\b/.test(q)) localStorage.removeItem('jt-noping');
    if (localStorage.getItem('jt-noping') || navigator.webdriver) return;
    if (!/(^|\.)jtcreative\.design$/.test(location.hostname)) return;
    var ss = sessionStorage;
    var sid = ss.getItem('jt-visit');
    if (!sid) { sid = Math.random().toString(36).slice(2) + Date.now().toString(36); ss.setItem('jt-visit', sid); }
    var send = function () {
      var path = location.pathname;
      if (ss.getItem('jt-last') === path) return;
      ss.setItem('jt-last', path);
      var n = (+ss.getItem('jt-n') || 0) + 1;
      ss.setItem('jt-n', n);
      fetch(ENDPOINT, {
        method: 'POST', mode: 'cors', keepalive: true,
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ sid: sid, n: n, path: path, ref: n === 1 ? document.referrer : '' })
      }).catch(function () {});
    };
    send();
    // Time on site: counted from the first page of the visit, sent whenever the tab is hidden or closed.
    if (!ss.getItem('jt-start')) ss.setItem('jt-start', Date.now());
    var lastLeave = -1;
    var leave = function () {
      var secs = Math.round((Date.now() - +ss.getItem('jt-start')) / 1000);
      if (secs - lastLeave < 5) return;
      lastLeave = secs;
      fetch(ENDPOINT, {
        method: 'POST', mode: 'cors', keepalive: true,
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ sid: sid, leave: secs })
      }).catch(function () {});
    };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') leave(); });
    addEventListener('pagehide', leave);
    // Things that open without changing the URL.
    var track = function (label) {
      var e = (+ss.getItem('jt-e') || 0) + 1;
      ss.setItem('jt-e', e);
      fetch(ENDPOINT, {
        method: 'POST', mode: 'cors', keepalive: true,
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ sid: sid, e: e, event: label })
      }).catch(function () {});
    };
    document.addEventListener('click', function (ev) {
      var t = ev.target.closest && ev.target.closest('[data-track],[data-launch-open],a,button');
      if (!t) return;
      if (t.hasAttribute('data-track')) return track(t.getAttribute('data-track'));
      if (t.hasAttribute('data-launch-open')) return track('Opened Just Launched');
      var label = (t.textContent || '').replace(/\s+/g, ' ').trim();
      var href = t.getAttribute('href') || '';
      if (t.tagName === 'A' && href && href.charAt(0) !== '#') return; // real page links show as page views
      if (/^snippets$/i.test(label)) track('Opened Snippets');
    }, true);
    var setItem = Storage.prototype.setItem;
    Storage.prototype.setItem = function (k, v) {
      if (this === localStorage && k === 'site-mode' && v !== localStorage.getItem('site-mode')) {
        track('Switched theme to ' + v);
      }
      return setItem.apply(this, arguments);
    };
    // Page transitions that change the URL without a full reload.
    var push = history.pushState;
    history.pushState = function () { var r = push.apply(this, arguments); setTimeout(send, 0); return r; };
    addEventListener('popstate', function () { setTimeout(send, 0); });
  } catch (e) {}
})();
</script>
