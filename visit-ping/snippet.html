<!-- Visit ping: one Slack message per new visitor session. No cookies, no Google Analytics.
     Skip your own visits: open https://www.jtcreative.design/?noping once on each of your browsers.
     Turn it back on with ?ping -->
<script>
(function () {
  var ENDPOINT = 'https://visit-ping.YOUR-SUBDOMAIN.workers.dev/';
  try {
    var q = location.search;
    if (/[?&]noping\b/.test(q)) localStorage.setItem('jt-noping', '1');
    if (/[?&]ping\b/.test(q)) localStorage.removeItem('jt-noping');
    if (localStorage.getItem('jt-noping') || navigator.webdriver) return;
    if (!/(^|\.)jtcreative\.design$/.test(location.hostname)) return;
    if (sessionStorage.getItem('jt-pinged')) return;
    sessionStorage.setItem('jt-pinged', '1');
    fetch(ENDPOINT, {
      method: 'POST',
      mode: 'cors',
      keepalive: true,
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ path: location.pathname, ref: document.referrer })
    }).catch(function () {});
  } catch (e) {}
})();
</script>
